<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>{{ app_name }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Webix dipakai minimal, hanya untuk notifikasi toast (lihat RtvUI.toast
       di core.js). Sisa UI tetap vanilla JS seperti sebelumnya. Jika CDN ini
       gagal dimuat (mis. tidak ada internet), aplikasi otomatis memakai toast
       buatan sendiri sebagai cadangan. -->
  <link rel="stylesheet" href="https://cdn.webix.com/edge/webix.css" />
  <script src="https://cdn.webix.com/edge/webix.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ asset_v }}" />

  <!-- Satu sumber nama aplikasi untuk semua halaman JS (login, sidebar, dokumen
       cetak). Ganti APP_NAME / APP_SHORT_NAME / APP_SUBTITLE / APP_TAGLINE di
       app/config.py (atau environment variable di Vercel) untuk mengubah nama
       aplikasi di seluruh tampilan tanpa menyentuh file JS.
       Catatan: data ditaruh di tag type="application/json" (bukan JavaScript)
       supaya Jinja {{ }} di dalamnya TIDAK pernah diparse/divalidasi sebagai
       JavaScript oleh editor kode (VS Code dkk) — jadi tidak akan pernah ada
       error "Property assignment expected" lagi, dalam kondisi apa pun. Lalu
       script biasa di bawahnya membaca isinya dengan JSON.parse(). -->
  <script id="rtv-app-data" type="application/json">{{ rtv_app_json|safe }}</script>
  <script>
    window.RTV_APP = JSON.parse(document.getElementById("rtv-app-data").textContent);
  </script>
</head>
<body data-theme="light">
  <div id="app-root"></div>

  <script src="{{ url_for('static', filename='js/core.js') }}?v={{ asset_v }}"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}?v={{ asset_v }}"></script>
  <script src="{{ url_for('static', filename='js/format.js') }}?v={{ asset_v }}"></script>
  <script src="{{ url_for('static', filename='js/ux.js') }}?v={{ asset_v }}"></script>
  <script src="{{ url_for('static', filename='js/print.js') }}?v={{ asset_v }}"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}?v={{ asset_v }}"></script>
  <script src="{{ url_for('static', filename='js/views.toko.js') }}?v={{ asset_v }}"></script>
  <script src="{{ url_for('static', filename='js/views.gudang.js') }}?v={{ asset_v }}"></script>
  <script src="{{ url_for('static', filename='js/views.admin.js') }}?v={{ asset_v }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_v }}"></script>
</body>
</html>
